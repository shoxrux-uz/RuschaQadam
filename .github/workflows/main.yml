name: APK yasash

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Loyiha papkasini topish
        run: |
          # settings.gradle qaysi papkada bo'lsa — loyiha o'sha yerda (ichma-ich papkalar bo'lsa ham ishlaydi)
          F=$(find . -name 'settings.gradle' -type f -not -path './.git/*' | head -n 1)
          if [ -z "$F" ]; then echo "settings.gradle topilmadi — loyiha fayllarini yuklang"; exit 1; fi
          P=$(dirname "$F")
          echo "Loyiha papkasi: $P"
          echo "PROJ=$P" >> "$GITHUB_ENV"

      - name: Node.js o'rnatish (testlar uchun)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Avtomatik testlar (QA)
        run: |
          cd "$PROJ"
          npm install --no-save --no-package-lock jsdom@24
          node tests/run-tests.js

      - name: Java 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle o'rnatish
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK yig'ish
        run: |
          cd "$PROJ"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Faylga nom berish
        run: cp "$PROJ/app/build/outputs/apk/debug/app-debug.apk" RuschaQadam.apk

      - name: APK ni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: RuschaQadam-APK
          path: RuschaQadam.apk

      - name: Release sahifasiga joylash
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Ruscha Qadam v1.${{ github.run_number }}
          body: "Telefonga o'rnatish uchun pastdagi RuschaQadam.apk faylini yuklab oling."
          files: RuschaQadam.apk
