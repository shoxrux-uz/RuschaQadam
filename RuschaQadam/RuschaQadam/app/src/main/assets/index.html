var QZ = null;
function startQuiz(qs, opts){
  opts = opts || {};
  QZ = {qs:qs, i:0, score:0, wrong:[], answered:false, picked:null, done:false, anim:true, opts:opts,
        title:opts.title||'Test', back:opts.back||['tests','Testlar'], lessonId:opts.lessonId||null};
  go('quiz');
}
function startNodeTest(id, back){
  var n=nodeById(id); if(!n) return;
  var qs, title=n.title;
  if(n.type==='lesson') qs=function(){ return buildLessonQuiz(id); };
  else if(n.type==='sound') qs=function(){ return buildSoundQuiz(10); };
  else if(n.type==='numbers') qs=function(){ return buildNumberQuiz(10); };
  else if(n.type==='dialog') qs=function(){ return buildDialogQuiz(n.dialogs, 8); };
  else qs=function(){ return buildExam(n.spec, n.n); };
  startQuiz(qs(), {title:title, back:back||['home','Bosh sahifa'], lessonId:n.type==='lesson'?id:null, nodeId:id, pass:n.pass, retry:qs,
    onDone:function(pct){ return nodeFinished(n, pct); }});
}
function nodeFinished(n, pct){
  var wasDone = nodeIsDone(n.id), bonus=0;
  if(n.type==='lesson'){ if(pct>=70) state.lessons[n.id]=Math.max(pct, nz(state.lessons[n.id])); }
  if(pct >= n.pass){
    state.path[n.id] = Math.max(pct, nz(state.path[n.id]));
    if(!wasDone){
      bonus = n.type==='final' ? 100 : (n.type==='exam' ? 50 : 30);
      var i=NODES.indexOf(n), nx=NODES[i+1];
      QZ.msgOk = nx ? '🔓 Yangi bosqich ochildi: «'+nx.title+'»' : '🎉 Barcha bosqichlar tugatildi!';
      if(nx) setTimeout(function(){ SFX.play('unlock'); }, 900);
      if(n.type==='final') QZ.cert = true;
    } else QZ.msgOk = '✓ Bosqich allaqachon tugatilgan — natija yangilandi';
  } else {
    if(nz(state.path[n.id])<pct) state.path[n.id]=pct;
    QZ.msgBad = 'O\'tish uchun kamida '+n.pass+'% kerak. Mavzuni takrorlab, yana urinib ko\'ring!';
  }
  return bonus;
}
function applyPlacement(){
  var per=[0,0,0];
  QZ.qs.forEach(function(q, i){ if(QZ.res[i]) per[q.unit]++; });
  var opened=0;
  for(var u=0; u<3; u++){
    if(per[u]>=4){ UNITS[u].nodes.forEach(function(n){ state.path[n.id]=Math.max(80, nz(state.path[n.id])); if(n.type==='lesson') state.lessons[n.id]=Math.max(80, nz(state.lessons[n.id])); }); opened++; }
    else break;
  }
  QZ.msgOk = opened ? '🎯 Natija: '+opened+' ta bo\'lim sizga tanish ekan — ular avtomatik ochildi. '+(opened<3?'Endi '+(opened+1)+'-bo\'limdan davom etasiz.':'Endi A1 yakuniy imtihoniga tayyorsiz!') : '🌱 Noldan boshlash eng to\'g\'ri yo\'l — 1-bo\'limdan boshlaymiz!';
  return 20;
}

/* Scramble */
function scrSetup(){
  var w=G.list[G.i]; var word=wordBare(w);
  var letters=word.split('');
  var mix; var t=0;
  do { mix=shuffle(letters.map(function(ch,i){ return {ch:ch, i:i}; })); t++; } while(mix.map(function(x){return x.ch;}).join('')===word && t<20);
  G.word=word; G.w=w; G.tiles=mix; G.used={}; G.ans=[]; G.status=''; G.hints=0;
}
GAME_VIEW.scramble = function(){
  if(G.i>=G.list.length){

    '<div class="pool">'+G.tiles.map(function(t,k){ return '<button class="lt '+(G.used[k]?'used':'')+'" data-act="scrPick" data-p="'+k+'">'+esc(t.ch)+'</button>'; }).join('')+'</div>'+
    '<div class="fb '+(G.status==='ok'?'ok':(G.status==='bad'?'bad':''))+'">'+(G.status==='ok'?'✓ To\'g\'ri! '+artHtml(w.de):(G.status==='bad'?'✗ Yana urinib ko\'ring':''))+'</div>'+
    '<div class="toolbar mt" style="justify-content:center">'+(G.status==='ok'?'<button class="btn btn-n" data-act="scrNext">Keyingi →</button>':'<button class="btn btn-o btn-s" data-act="scrClear">↺ Tozalash</button><button class="btn btn-o btn-s" data-act="scrHint">💡 Yordam</button><button class="btn btn-o btn-s" data-act="scrSkip">O\'tkazib yuborish →</button>')+'</div></div></div>';
  return h;
};
function scrCheck(){
  if(G.ans.length!==G.tiles.length) return;
  var s=G.ans.map(function(ti){ return G.tiles[ti].ch; }).join('');
  if(s===G.word){ G.status='ok'; if(G.hints<2){ G.score++; } state.learned[G.w.id]=1; saveState(); say(G.w.de); }
  else G.status='bad';
}
function scrHint(){
  /* to'g'ri prefiksni qoldirib, keyingi to'g'ri harfni qo'yadi */
  var cur=G.ans.map(function(ti){ return G.tiles[ti].ch; }).join('');
  var k=0; while(k<G.ans.length && cur[k]===G.word[k]) k++;
  var keep=G.ans.slice(0,k); G.used={}; keep.forEach(function(ti){ G.used[ti]=1; }); G.ans=keep;
  if(k>=G.word.length) return;
  var need=G.word[k];
  for(var i=0;i<G.tiles.length;i++){ if(!G.used[i] && G.tiles[i].ch===need){ G.used[i]=1; G.ans.push(i); break; } }
  G.hints++; G.status=''; scrCheck();
}

/* =====================================================================
   TALAFFUZNI TEKSHIRISH (mikrofon + nutqni tanish)
   Android ilovada — telefonning nutqni tanish xizmati (AndroidTTS.listen),
   brauzerda — Web Speech API (agar mavjud bo'lsa).
   ===================================================================== */
function levDist(a, b){
  var m=a.length, n=b.length; if(!m) return n; if(!n) return m;
  var prev=[], cur=[], i, j;
  for(j=0;j<=n;j++) prev[j]=j;
  for(i=1;i<=m;i++){
    cur=[i];
    for(j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));
    prev=cur;
  }
  return prev[n];
}
function strSim(a, b){ if(!a && !b) return 1; return 1 - levDist(a,b)/Math.max(a.length,b.length); }
/* Solishtirish uchun matnni tekislash: kichik harf, umlaut → ae/oe/ue, raqamlar → ruscha so'z */
function normPron(s){
  s = String(s||'').toLowerCase().replace(/\d+/g, function(d){ var n=parseInt(d,10); return (n>=0 && n<=1000000) ? numDe(n).toLowerCase() : d; });
  return norm(s).replace(/[-–—'’`´()\[\]]/g,' ').replace(/\s+/g,' ').trim();
}
/* target — namuna, alts — tanish tizimi bergan variantlar. Natija: ball (0–100), eshitilgan matn, so'zlar bo'yicha belgilar */
function scorePron(target, alts){
  var tokens = String(target||'').split(/\s+/).filter(Boolean);
  var tnorm = tokens.map(normPron);
  var full = tnorm.join('');
  var best = {score:0, heard:'', marks:tokens.map(function(){ return false; })};
  (alts||[]).forEach(function(alt){
    var h = normPron(alt), hw = h.split(' ').filter(Boolean);
    var real=0, ok=0;
    var marks = tnorm.map(function(w){
      if(!w) return true;
      real++;
      var hit = hw.some(function(x){ return x===w || (w.length>2 && strSim(x,w)>=0.75); });
      if(hit) ok++;
      return hit;
    });
    var ws = real ? ok/real : 0;
    var cs = strSim(full, h.replace(/ /g,''));
    var sc = Math.round(Math.max(ws, cs)*100);
    if(sc>best.score || !best.heard) best = {score:sc, heard:alt, marks:marks};
  });
  return best;
}

var _buildExamA1 = buildExam;
buildExam = function(spec, n){
  if(!spec.gram || !spec.gram.length) return _buildExamA1(spec, n);
  var out=[], used={}, tries=0;
  var gramN = Math.round(n*0.5);
  var gl = spec.gram.slice(), i=0;
  while(out.length<gramN && tries<n*20){
    tries++;
    var g=GRAM_MAP[gl[i%gl.length]]; i++;
    var mcs=g.drill.filter(function(d){ return d.t==='mc'; });
    var q=qGram(mcs[rnd(0,mcs.length-1)], g.id, true);
    var key=q.say+'|'+q.answer; if(used[key]) continue; used[key]=1; out.push(q);
  }
  var rest = (spec.cats&&spec.cats.length) ? _buildExamA1({cats:spec.cats, lessons:spec.lessons, numbers:spec.numbers, dialogs:spec.dialogs, sound:spec.sound}, n-out.length) : [];
  rest.forEach(function(q){ var key=q.say+'|'+q.answer; if(!used[key]){ used[key]=1; out.push(q); } });
  /* yetmasa — grammatikadan to'ldiramiz */
  tries=0;
  while(out.length<n && tries<200){
    tries++;
    var g2=GRAM_MAP[spec.gram[rnd(0,spec.gram.length-1)]], m2=g2.drill.filter(function(d){ return d.t==='mc'; });
    var q2=qGram(m2[rnd(0,m2.length-1)], g2.id, true), k2=q2.say+'|'+q2.answer;
    if(!used[k2]){ used[k2]=1; out.push(q2); }
  }
  return shuffle(out).slice(0,n);
};

function quizMark(ok, picked, el){
  var q=QZ.qs[QZ.i];

  QZ.res = QZ.res || []; QZ.res[QZ.i] = ok;

    QZ.score++; state.correct = nz(state.correct)+1;
    if(q.wid){ state.learned[q.wid]=1; if(state.wrong[q.wid]){ state.wrong[q.wid]--; if(state.wrong[q.wid]<=0) delete state.wrong[q.wid]; } }
    SFX.play('ok');
  } else {
    QZ.wrong.push(q);
    if(q.wid) state.wrong[q.wid] = nz(state.wrong[q.wid])+1;
    SFX.play('bad');
  }
  if(q.wid && WMAP[q.wid]){ var c=WMAP[q.wid].cat, cs=state.cat[c]||[0,0]; cs[1]++; if(ok) cs[0]++; state.cat[c]=cs; }

}

/* Zarrachalar */
function burst(x, y, n){
  if(REDUCED || document.documentElement.classList.contains('rm')) return;
  var cols=['#FF6B5B','#F2C230','#2F8F6B','#2B4583','#FFB199'];
  for(var i=0;i<(n||16);i++){
    var p=document.createElement('i'); p.className='ptc';
    var a=Math.random()*Math.PI*2, d=40+Math.random()*60;
    p.style.left=x+'px'; p.style.top=y+'px'; p.style.background=cols[i%cols.length];
    p.style.setProperty('--dx', Math.cos(a)*d+'px'); p.style.setProperty('--dy', Math.sin(a)*d-20+'px');
    if(i%3===0) p.style.borderRadius='50%';
    document.body.appendChild(p);
    (function(el){ setTimeout(function(){ el.remove(); }, 800); })(p);
  }
}
